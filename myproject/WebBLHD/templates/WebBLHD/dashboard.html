<!-- SEARCH & FILTER CARD -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body bg-white rounded p-3">
                <form method="GET" class="row g-3 align-items-center">
                    <!-- Ô tìm kiếm mã ID hoặc tiêu đề -->
                    <div class="col-md-3">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" name="q" class="form-control" placeholder="Mã ID hoặc tiêu đề..." value="{{ query }}">
                        </div>
                    </div>
                    <!-- Lọc theo khu vực camera -->
                    <div class="col-md-2">
                        <select name="camera" class="form-select">
                            <option value="">-- Khu vực --</option>
                            <option value="san_truong" {% if selected_camera == 'san_truong' %}selected{% endif %}>Sân trường</option>
                            <option value="san_bong" {% if selected_camera == 'san_bong' %}selected{% endif %}>Sân bóng</option>
                            <option value="lop_a" {% if selected_camera == 'lop_a' %}selected{% endif %}>Lớp học A</option>
                            <option value="lop_b" {% if selected_camera == 'lop_b' %}selected{% endif %}>Lớp học B</option>
                            <option value="hanh_lang" {% if selected_camera == 'hanh_lang' %}selected{% endif %}>Hành lang</option>
                            <option value="cang_tin" {% if selected_camera == 'cang_tin' %}selected{% endif %}>Căng tin</option>
                        </select>
                    </div>
                    <!-- Lọc theo trạng thái AI -->
                    <div class="col-md-2">
                        <select name="status" class="form-select">
                            <option value="">-- Trạng thái --</option>
                            <option value="PENDING" {% if selected_status == 'PENDING' %}selected{% endif %}>Chờ xử lý</option>
                            <option value="PROCESSING" {% if selected_status == 'PROCESSING' %}selected{% endif %}>Phân tích AI</option>
                            <option value="SAFE" {% if selected_status == 'SAFE' %}selected{% endif %}>An toàn</option>
                            <option value="WARNING" {% if selected_status == 'WARNING' %}selected{% endif %}>Cảnh báo</option>
                        </select>
                    </div>
                    <!-- Lọc theo ngày ghi hình -->
                    <div class="col-md-2">
                        <input type="date" name="date" class="form-control" value="{{ selected_date }}" title="Lọc theo ngày ghi hình">
                    </div>
                    <!-- Nút bấm lọc & reset -->
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-dark w-100"><i class="bi bi-filter"></i> Lọc</button>
                        <a href="{% url 'video_list' %}" class="btn btn-outline-secondary" title="Đặt lại bộ lọc"><i class="bi bi-arrow-counterclockwise"></i></a>
                    </div>
                </form>
            </div>
        </div>
